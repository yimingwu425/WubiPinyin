name: Build WubiPinyin installer

on:
  push:
    branches:
      - '*'
    tags:
      - '[0-9]+.*'
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    name: Windows 11 x64 installer
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      SDKVER: 10.0.19041.0
      boost_version: 1.84.0
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure product build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item env.vs2022.bat env.bat
          $reference = (git describe --tags --always).Trim()
          "git_ref_name=$reference" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Visual Studio 2022
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDKVER }}

      - name: Verify packaging prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\Bin\makensis.exe')
          )
          $nsis = $nsisCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS makensis.exe is not installed on the runner.' }
          & $nsis /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'NSIS failed its version check.' }
          foreach ($tool in 'cmake', 'git', 'bash') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Required build tool was not found: $tool"
            }
          }

      - name: Restore Boost
        id: cache-boost
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: windows-2022-boost-${{ env.boost_version }}-msvc143-static-v1

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmd /c install_boost.bat
          if ($LASTEXITCODE -ne 0) { throw 'Boost build failed.' }

      - name: Save Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: windows-2022-boost-${{ env.boost_version }}-msvc143-static-v1

      - name: Compile WinUI settings first
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmd /c WubiPinyinSettings\build_release.bat
          if ($LASTEXITCODE -ne 0) { throw 'WubiPinyin settings build failed.' }

      - name: Build and package WubiPinyin
        shell: pwsh
        env:
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          cmd /c build.bat release installer verify-hybrid-filter
          if ($LASTEXITCODE -ne 0) { throw 'WubiPinyin installer build failed.' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WubiPinyin-Windows-11-x64-installer-${{ github.run_number }}
          if-no-files-found: error
          path: output\archives\wubipinyin-*-installer.exe

      - name: Publish installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: output/archives/wubipinyin-*-installer.exe
